<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="مساعد ذكي لأخصائي تحليل السلوك (BCBA): رصد سلوكيات حركية معرّفة تشغيليًا (رفع اليد، التصفيق، القيام ومغادرة الكرسي، رفرفة اليدين، التأرجح، القفز، الدوران، المشي على أطراف الأصابع) بالكاميرا داخل الجهاز دون تسجيل فيديو.">
<meta name="theme-color" content="#1D5C63">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مساعد BCBA الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: clinical workbench — a fixed side rail of tools (right, RTL), a working sheet in the middle styled like an ABA frequency data sheet: tally marks, timestamped rows, agreement gauges. */
:root{
  --paper:#EFF2EF; --sheet:#FFFFFF; --ink:#14221E; --muted:#56665F; --line:#D5DDD8; --rule:#E7ECE9;
  --accent:#1D5C63; --accent-ink:#FFFFFF; --accent-soft:#E1EEEE;
  --b-raise:#2F5FC4; --b-clap:#B83B6B; --b-stand:#6E46AE;
  --b-flap:#C4581C; --b-rock:#8B6B12; --b-jump:#23824A; --b-spin:#0E7490; --b-leave:#7A5230; --b-toe:#9F1239; --b-other:#6B7280;
  --good:#2C7A47; --warn:#A86A12; --bad:#B23A2C;
  --display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1513; --sheet:#151F1C; --ink:#E2EAE6; --muted:#97A7A0; --line:#2B3A35; --rule:#1F2B27;
  --accent:#6BB7BD; --accent-ink:#0B1714; --accent-soft:#1B3134;
  --b-raise:#86A6F2; --b-clap:#EC85A8; --b-stand:#B79BEA;
  --b-flap:#F0A06A; --b-rock:#D9B95A; --b-jump:#74CF95; --b-spin:#5CC3DC; --b-leave:#C99A70; --b-toe:#F48FA6; --b-other:#A3AAB5;
  --good:#6CC28B; --warn:#E0A54A; --bad:#EE8576; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1513; --sheet:#151F1C; --ink:#E2EAE6; --muted:#97A7A0; --line:#2B3A35; --rule:#1F2B27;
  --accent:#6BB7BD; --accent-ink:#0B1714; --accent-soft:#1B3134;
  --b-raise:#86A6F2; --b-clap:#EC85A8; --b-stand:#B79BEA;
  --b-flap:#F0A06A; --b-rock:#D9B95A; --b-jump:#74CF95; --b-spin:#5CC3DC; --b-leave:#C99A70; --b-toe:#F48FA6; --b-other:#A3AAB5;
  --good:#6CC28B; --warn:#E0A54A; --bad:#EE8576; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.5rem;font-weight:700} h2{font-size:1.2rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono,time,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding-block:24px;padding-inline:16px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:var(--paper)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--display);font-size:1.05rem}
.brand span{font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:.92rem;color:var(--muted)}
.nav button:hover{background:var(--rule);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button .ix{font-family:var(--mono);font-size:.72rem;width:18px;color:var(--muted)}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.nav button.off{opacity:.45}
.cur-file{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:4px 10px 8px;font-size:.78rem;color:var(--muted)}
.cur-file b{font-size:1rem;color:var(--ink)}
.cur-file span:first-child{flex-basis:100%}
.cur-file.none{font-style:italic}
.fileno{font-family:var(--mono);font-size:2.4rem;font-weight:500;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate}
.badge-count{margin-inline-start:auto;font-family:var(--mono);font-size:.72rem;background:var(--warn);color:var(--sheet);border-radius:10px;padding:0 7px}
.store-chip{margin-top:auto;font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.store-chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:7px;flex:none}
.store-chip.shared i{background:var(--good)}

main{min-width:0;overflow-x:clip;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.view[hidden]{display:none!important}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:68ch}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.sheet.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:.84rem}
hr{border:0;border-top:1px solid var(--rule);margin:0}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:7px 14px;font-size:.9rem;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.82rem}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{margin-top:6px;accent-color:var(--accent)}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-inline-start:3px solid var(--rule)}
.kpi .v{font-family:var(--display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{font-size:.82rem;color:var(--muted)}
.kpi.attn{border-inline-start-color:var(--warn)}

/* behaviour chips & tallies */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-raise{color:var(--b-raise)} .c-clap{color:var(--b-clap)} .c-stand{color:var(--b-stand)}
.c-flap{color:var(--b-flap)} .c-rock{color:var(--b-rock)} .c-jump{color:var(--b-jump)} .c-spin{color:var(--b-spin)} .c-leave{color:var(--b-leave)} .c-toe{color:var(--b-toe)} .c-other{color:var(--b-other)}
.p-other{background:color-mix(in srgb,var(--b-other) 16%,transparent);color:var(--b-other)}
.tgt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.tgt-grid .check{font-size:.86rem}
.pill{font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:4px;white-space:nowrap}
.p-pending{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-approved{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.p-rejected{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.p-undet{background:var(--rule);color:var(--muted)}
.p-sync{background:var(--accent-soft);color:var(--accent);font-weight:600}
.counter.sync{color:var(--accent)}
.counter .sub{font-size:.78rem;color:var(--muted)}
.combo-list{display:flex;flex-direction:column;gap:2px;font-size:.84rem;color:var(--ink)}
.tally{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.tally svg{display:block}
.counter{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-top:3px solid currentColor;background:var(--sheet);border-radius:0 0 8px 8px}
.counter .n{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.counter .lbl{font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .ctx{min-width:170px}

/* session */
.stage{position:relative;background:#0B0F0E;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#C9D4CF;text-align:center;padding:20px}
.stage .empty svg{opacity:.75}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.timeline{width:100%;height:auto;display:block}
.status-line{font-size:.86rem;color:var(--muted);min-height:1.4em}
.notice{padding:10px 14px;border-radius:8px;font-size:.88rem;border:1px solid var(--line);background:var(--sheet)}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}

/* definitions */
.def{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px;font-size:.92rem}
.def dt{color:var(--muted);font-size:.82rem;padding-top:2px}
.def dd{margin:0}
.beh-card{border-top:3px solid currentColor}
.beh-card .inner{color:var(--ink);display:flex;flex-direction:column;gap:14px}

/* ioa */
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .bar{position:relative;height:10px;border-radius:5px;background:var(--rule)}
.gauge .bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px}
.gauge .bar b{position:absolute;inset-block:-4px;width:2px;background:var(--ink);inset-inline-start:80%}
.verdict{font-weight:600;font-size:.84rem}

/* report */
.chart svg{width:100%;height:auto;display:block}
.out{white-space:pre-wrap;line-height:1.85;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-height:120px}

/* method */
.method{max-width:72ch;display:flex;flex-direction:column;gap:14px}
.method ol,.method ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);direction:ltr;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:.86rem;overflow-x:auto}
.refs li{font-size:.86rem}

.toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-inline-start:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.store-chip,.nav .sep,.nav .ix{display:none}
  .cur-file{flex-wrap:nowrap;padding:0 6px;white-space:nowrap;border-inline-start:1px solid var(--line);margin-inline-start:4px}
  .cur-file span:first-child{display:none}
  .brand b{white-space:nowrap;font-size:.95rem}
  .nav{flex-direction:row;gap:2px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){ .g2{grid-template-columns:minmax(0,1fr)} .def{grid-template-columns:minmax(0,1fr)} .def dt{padding-top:6px} }
@media (max-width:620px){
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards td{display:block;width:100%}
  table.cards tr{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:12px;row-gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td{border:0;padding:0;grid-column:2;min-width:0}
  table.cards td:first-child{grid-column:1;grid-row:1 / span 8}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--muted);margin-bottom:2px}
  table.cards td .ctx{min-width:0;width:100%}
  table.cards td .row{flex-wrap:wrap!important}
  table.cards td .btn.sm{padding:7px 16px;font-size:.9rem}
}
.swatch{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-block;flex:none;background-image:repeating-linear-gradient(45deg,var(--rule) 0 4px,transparent 4px 8px)}
.stage.picking{cursor:crosshair;outline:3px solid var(--accent);outline-offset:2px}
.mk-box{border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:5rem;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <aside class="rail">
    <div class="brand"><b>مساعد BCBA الذكي</b><span>تجربة: دقة نظام الرؤية الحاسوبية في رصد السلوكيات الحركية</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="store-chip" id="storeChip"><i></i><span>جارٍ الاتصال بالمخزن…</span></div>
  </aside>
  <main><div class="wrap" id="views"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
/* ---------- constants ---------- */
const BEH = {
  raise:{name:'رفع اليد', cls:'c-raise', varc:'--b-raise',
    def:'وصول الرسغ إلى مستوى أعلى من الكتف.',
    start:'تبدأ الحالة عند تجاوز هذا المستوى.',
    end:'تنتهي عند نزول الرسغ إلى مستوى الكتف أو أقل.',
    rule:'رفع اليدين معًا يُحسب حالة واحدة، مع تسجيل هل الرفع بيد واحدة أو باليدين. استمرار اليد مرفوعة لا يُحسب مرات إضافية، وتُحسب حالة جديدة بعد نزول اليدين ثم الرفع مجددًا.',
    tech:'مقارنة موضع الرسغ (النقطتان 15 و16) بموضع الكتف (11 و12). بداية الحالة عند ارتفاع الرسغ فوق الكتف بهامش صغير، ونهايتها عند عودته إلى مستوى الكتف، مع تأكيد إطارين متتاليين.'},
  clap:{name:'التصفيق', cls:'c-clap', varc:'--b-clap',
    def:'كل تلامس بين راحتي الكفين، يليه انفصالهما.',
    start:'لحظة تلامس الكفين.',
    end:'لحظة انفصالهما.',
    rule:'كل تلامس يليه انفصال يُحسب تصفيقة واحدة. خمس تصفيقات متتابعة تُحسب خمسًا. بقاء الكفين متلامسين لا يُحسب تصفيقات إضافية، ولا نحتاج فاصلًا زمنيًا ثابتًا ما دمنا نعدّ كل تصفيقة منفردة.',
    tech:'المسافة بين الكفين (منتصف الرسغ وطرف السبابة) منسوبةً إلى عرض الكتفين. أقل من 0.45 = تلامس، أكثر من 0.75 = انفصال. للعرض فقط، تُجمع التصفيقات المتقاربة (أقل من 1.5 ثانية) في سطر واحد، وكل تصفيقة تُعدّ منفردة.'},
  stand:{name:'القيام من الكرسي', cls:'c-stand', varc:'--b-stand',
    def:'الانتقال من الجلوس إلى الوقوف الكامل على القدمين مع ابتعاد الأرداف عن المقعد.',
    start:'الانتقال من وضع الجلوس.',
    end:'الوصول إلى الوقوف الكامل.',
    rule:'النهوض الجزئي ثم الجلوس لا يُحسب وقوفًا كاملًا. استمرار الشخص واقفًا يُحسب مرة واحدة، وتُحسب مرة جديدة بعد جلوسه ثم وقوفه مجددًا.',
    tech:'زاوية الركبة (ورك–ركبة–كاحل) وارتفاع الورك عن الركبة منسوبًا إلى طول الجذع. جلوس: زاوية ≤ 120° أو الورك بمستوى الركبة تقريبًا (عند التصوير من الأمام). وقوف: زاوية ≥ 160° والورك أعلى من الركبة بنصف طول الجذع، لمدة 0.3 ثانية.'},
  flap:{name:'رفرفة اليدين', cls:'c-flap', varc:'--b-flap', unit:'نوبة', episodic:true,
    def:'حركة متكررة لإحدى اليدين أو كلتيهما ذهابًا وإيابًا بالنسبة للساعد، تتضمن دورتين متتاليتين على الأقل؛ والدورة انتقال اليد في اتجاه ثم عودتها.',
    start:'أول حركة في التسلسل الذي يستوفي التعريف.',
    end:'آخر حركة إذا أعقبها توقف لمدة ثانيتين.',
    rule:'حركة اليدين معًا تُحسب نوبة واحدة. لا يدخل ضمن التعريف رفع اليد والثبات بها، أو التصفيق. التلويح الذي يأخذ الشكل الحركي نفسه لا يُفرَّق من الحركة وحدها؛ يُسجَّل للمراجعة دون افتراض الغرض منه.',
    measure:'عدد النوبات ومدتها، وليس عدد كل حركة صغيرة.',

  for(let i=0;i<groups;i++) out+=g(5);

const Store = {
  mode:'none', db:null,
  sb:null, user:null,
  async init(){
    const cfg=window.BCBA_CONFIG||{};
    if(cfg.supabaseUrl && cfg.supabaseKey){
      try{ await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
        this.sb=window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey); this.mode='cloud';
        const r=await this.sb.auth.getSession(); this.user=r.data?.session?.user||null; return; }
      catch(e){ this.cloudError='تعذّر الاتصال بقاعدة البيانات، والبيانات تُحفظ مؤقتًا في هذا الجهاز.'; this.sb=null; }
    }
    try{
      if(window.claude && typeof window.claude.use==='function'){
        const db = await Promise.race([window.claude.use('db'), new Promise(r=>setTimeout(()=>r(null),6000))]);
        if(db){ this.db=db; this.mode='db'; return; }
      }
    }catch(e){}
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); this.mode='local'; }catch(e){ this.mode='memory'; }
  },
  _mem:{},
  _lk(c){ return 'bcba:'+c; },
  _lread(c){ if(this.mode==='memory') return this._mem[c]||{}; try{ return JSON.parse(localStorage.getItem(this._lk(c))||'{}'); }catch(e){ return {}; } },
  _lwrite(c,o){ if(this.mode==='memory'){ this._mem[c]=o; return; } try{ localStorage.setItem(this._lk(c),JSON.stringify(o)); }catch(e){} },
  async _q(q){ const {data,error}=await q; if(error) throw new Error(error.message); return data; },
  async list(c){
    if(this.sb){ const rows=await this._q(this.sb.from('records').select('id,data').eq('collection',c).limit(5000)); return rows.map(r=>({...r.data, id:r.id})); }
    if(this.db){ const s=await this.db.collection(c).get(); return s.docs.map(d=>({id:d.id,...d.data()})); }
    return Object.entries(this._lread(c)).map(([id,v])=>({id,...v}));
  },
  async get(c,id){
    if(this.sb){ const r=await this._q(this.sb.from('records').select('id,data').eq('collection',c).eq('id',id).maybeSingle()); return r? {...r.data, id:r.id} : null; }
    if(this.db){ const d=await this.db.doc(c+'/'+id).get(); return d.exists? {id,...d.data()} : null; }
    const o=this._lread(c); return o[id]? {id,...o[id]} : null;
  },
  async set(c,id,data){
    const clean = JSON.parse(JSON.stringify(data)); delete clean.id;
    if(this.sb) return this._q(this.sb.from('records').upsert({collection:c, id, data:clean}));
    if(this.db) return this.db.doc(c+'/'+id).set(clean);
    const o=this._lread(c); o[id]=clean; this._lwrite(c,o);
  },
  async update(c,id,patch){
    if(this.sb){ const cur=await this.get(c,id)||{}; delete cur.id; return this.set(c,id,{...cur, ...JSON.parse(JSON.stringify(patch))}); }
    if(this.db) return this.db.doc(c+'/'+id).update(JSON.parse(JSON.stringify(patch)));
    const o=this._lread(c); o[id]={...(o[id]||{}),...patch}; this._lwrite(c,o);
  },
  async del(c,id){
    if(this.sb) return this._q(this.sb.from('records').delete().eq('collection',c).eq('id',id));
    if(this.db) return this.db.doc(c+'/'+id).delete();
    const o=this._lread(c); delete o[id]; this._lwrite(c,o);
  }
};

const S = { child:null, childId:null, newChild:false, justCreated:false, children:[], allSessions:[], allEvents:[], sessions:[], events:[], sources:[], view:'files', reviewFilter:{session:'all',beh:'all',status:'all'}, ioaSession:null, reportStart:null, includePending:false };
async function loadAll(){
  const [m, ch, se, ev, so] = await Promise.all([Store.list('meta'), Store.list('children'), Store.list('sessions'), Store.list('events'), Store.list('sources')]);
  S.children = ch.sort((a,b)=>(+a.fileNo||0)-(+b.fileNo||0));
  // earlier versions kept one child in meta/child and sessions without a file: move them into file 0001
  const orphan = se.filter(x=>!x.childId), legacy = m.find(x=>x.id==='child');
  if(orphan.length || (legacy && legacy.code && !S.children.some(c=>c.legacy))){
    let target = S.children.find(c=>c.legacy);
    if(!target){ const id='c-'+uid(); const d={...blankChild(), ...(legacy||{}), fileNo:nextFileNo(), legacy:true, createdAt:Date.now()}; delete d.id;
      if(!d.code && orphan.some(x=>x.example)) d.code='مثال تجريبي';
      await Store.set('children', id, d); target={id,...d}; S.children.push(target); }
    for(const x of orphan){ await Store.update('sessions', x.id, {childId:target.id}); x.childId=target.id; }
  }
  S.allSessions = se.sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  S.allEvents = ev.sort((a,b)=>a.start-b.start);
  S.sources = so.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  applyChild();
}
function applyChild(){
  S.child = S.children.find(c=>c.id===S.childId) || null;
  if(!S.child) S.childId=null;
  S.sessions = S.allSessions.filter(x=>x.childId && x.childId===S.childId);
  const ids = new Set(S.sessions.map(x=>x.id));
  S.events = S.allEvents.filter(e=>ids.has(e.sessionId));

const sessionById = id => S.sessions.find(s=>s.id===id);
/* Simultaneous actions: two different behaviours whose times overlap (±SYNC_TOL s).
   Each overlapping event is counted in a separate "متزامن" box, not in the solo box. */
const SYNC_TOL = 0.3;
const comboName = set => BKEYS.filter(b=>set.has(b)).map(b=>BEH[b].name).join(' + ');
function cooccur(evs){
  evs = evs.filter(e=>e.kind==='event');
  // every event is an interval; counted behaviours (clap, jump, spin, toe) also carry unit times
  const N = evs.map(e=>({e, b:e.behavior, s:e.start, t:Math.max(e.end, e.start), pts: MULTI.has(e.behavior)? ((e.times&&e.times.length)? e.times : [e.start]) : null}));
  const withMap = new Map(); const mark=(e,b)=>{ if(!withMap.has(e)) withMap.set(e,new Set()); withMap.get(e).add(b); };
  const parent = N.map((_,i)=>i); const find=i=>parent[i]===i?i:(parent[i]=find(parent[i])); const unite=(a,b)=>{ parent[find(a)]=find(b); };
  const unitHit = new Map(); const hitPt=(x,k)=>{ if(!unitHit.has(x.e)) unitHit.set(x.e,new Set()); unitHit.get(x.e).add(k); };
  const inIv = (t,x) => t>=x.s-SYNC_TOL && t<=x.t+SYNC_TOL;
  for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
    const A=N[i], B=N[j]; if(A.b===B.b || NOSYNC.has(A.b+'|'+B.b)) continue;
    let hit=false;
    if(!A.pts && !B.pts) hit = A.s<=B.t+SYNC_TOL && B.s<=A.t+SYNC_TOL;
    else {
      if(A.pts) A.pts.forEach((t,k)=>{ if(inIv(t,B)){ hit=true; hitPt(A,k); } });
      if(B.pts) B.pts.forEach((t,k)=>{ if(inIv(t,A)){ hit=true; hitPt(B,k); } });
    }
    if(hit){ mark(A.e,B.b); mark(B.e,A.b); unite(i,j); }
  }
  const groups = new Map();
  N.forEach((x,i)=>{ if(!withMap.has(x.e)) return; const r=find(i); if(!groups.has(r)) groups.set(r,{beh:new Set(), start:Infinity, end:-Infinity, claps:0}); const g=groups.get(r); g.beh.add(x.b); g.start=Math.min(g.start,x.s); g.end=Math.max(g.end,x.t); if(x.b==='clap') g.claps+=(unitHit.get(x.e)||new Set()).size; });
  const episodes=[...groups.values()].filter(g=>g.beh.size>1).map(g=>({label:comboName(g.beh), behaviors:[...g.beh], start:g.start, end:g.end, claps:g.claps})).sort((a,b)=>a.start-b.start);
  const per={}; BKEYS.forEach(b=>{ const list=evs.filter(e=>e.behavior===b);
    if(MULTI.has(b)){ const total=sum(list.map(e=>e.count??((e.times||[]).length||1))); const sync=Math.min(total, sum(list.map(e=>Math.min((unitHit.get(e)||new Set()).size, e.count??Infinity)))); per[b]={total, sync, solo:total-sync}; }
    else { const total=list.length, sync=list.filter(e=>withMap.has(e)).length; per[b]={total, sync, solo:total-sync}; } });
  const combos={}; episodes.forEach(x=>{ combos[x.label]=(combos[x.label]||0)+1; });
  return {per, episodes, combos, withMap};
}
function mergeCo(list){ const out={per:{}, episodes:[], combos:{}}; BKEYS.forEach(b=>out.per[b]={total:0,sync:0,solo:0});
  list.forEach(c=>{ BKEYS.forEach(b=>{ ['total','sync','solo'].forEach(k=>out.per[b][k]+=c.per[b][k]); }); out.episodes.push(...c.episodes); Object.entries(c.combos).forEach(([k,v])=>out.combos[k]=(out.combos[k]||0)+v); });
  return out; }
const syncLine = co => Object.keys(co.combos).length? Object.entries(co.combos).map(([k,v])=>`${k}: ${v}`).join('، ') : 'لا يوجد';
const evOf = (sid, b) => S.events.filter(e=>e.sessionId===sid && (!b || e.behavior===b));
const evCount = e => e.kind==='event' ? (e.count||1) : 0;

async function importData(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let d; try{ d=JSON.parse(await f.text()); }catch(err){ toast('الملف ليس JSON صالحًا'); return; }
  if(!d || !Array.isArray(d.sessions) || !Array.isArray(d.events)){ toast('هذا ليس ملف بيانات من مساعد BCBA'); return; }
  let ns=0, ne=0, nr=0;
  try{
    let cid=S.childId;
    if(d.child && d.child.id){ if(!S.children.some(x=>x.id===d.child.id)){ const c={...d.child}; if(S.children.some(x=>+x.fileNo===+c.fileNo)) c.fileNo=nextFileNo(); await Store.set('children',c.id,c); S.children.push(c); } cid=d.child.id; }
    if(!cid){ toast('افتحي ملف الطفل أولًا ثم استوردي'); return; }
    d.sessions.forEach(x=>{ if(!x.childId) x.childId=cid; });
    for(const s of d.sessions){ if(!s.id) continue; if(!sessionById(s.id)) ns++; await Store.set('sessions',s.id,s); }
    for(const ev of d.events){ if(!ev.id||!ev.sessionId) continue; if(!S.events.some(x=>x.id===ev.id)) ne++; await Store.set('events',ev.id,ev); }
    for(const r of (d.sources||[])){ if(!r.id) continue; if(!S.sources.some(x=>x.id===r.id)) nr++; await Store.set('sources',r.id,r); }
  }catch(err){ toast('تعذّر الاستيراد: '+(err.message||err)); return; }
  await loadAll(); render(); lastView=null; S.childId=cid; applyChild(); render(); toast(`استُورد إلى ملف ${fmtFile(S.child?.fileNo)}: جلسات جديدة ${ns}، أحداث ${ne}، مصادر ${nr}`);
}

  closeSpin(){ const s=this.sp.series; if(s) this.events.push({behavior:'spin', kind:'event', start:s.start, end:s.end, count:s.times.length, times:s.times, detail: s.times.length===1? 'دورة كاملة' : `${s.times.length} دورات كاملة متتالية`, key:s.key}); this.sp.series=null; }
  toeStep(t, lm, hipsV, leg){
    const P=i=>this.P(lm,i), V=this.V, tw=this.tw;
    const okF = k => P(27+k).v>=V && P(29+k).v>=V && P(31+k).v>=V;
    const flen = (Math.hypot(P(29).x-P(31).x,P(29).y-P(31).y)+Math.hypot(P(30).x-P(32).x,P(30).y-P(32).y))/2;
    const ok = okF(0) && okF(1) && hipsV && flen>=0.12*leg;
    this.undet('toe', ok, t);
    if(!ok){ tw.f.forEach(f=>{ f.prev=null; }); return; }
    for(const k of [0,1]){
      const h=P(29+k), f=P(31+k), st=tw.f[k]; const cx=(h.x+f.x)/2, cy=(h.y+f.y)/2;
      const lift=(f.y-h.y)/Math.max(1,Math.hypot(h.x-f.x,h.y-f.y));
      if(st.prev){ const sp=Math.hypot(cx-st.prev.x, cy-st.prev.y)/leg/Math.max(1e-3,t-st.prev.t); st.v = st.v==null? sp : 0.5*st.v+0.5*sp; }
      st.prev={t,x:cx,y:cy};
      if(st.v==null) continue;
      if(st.phase!=='swing' && st.v>0.8){ if(st.phase==='stance') this.endStance(k); st.phase='swing'; st.sw={x:cx,y:cy}; }
      else if(st.phase==='swing' && st.v<0.25){ const disp=st.sw? Math.hypot(cx-st.sw.x, cy-st.sw.y)/leg : 0; st.phase='stance'; st.stance={t, min:lift, step:disp>=0.25, done:false}; }
      else if(st.phase==='stance'){ st.stance.min=Math.min(st.stance.min, lift); if(t-st.stance.t>=0.8) this.endStance(k); }
      else if(!st.phase && st.v<0.25) st.phase='still';
    }
  }
  endStance(k){
    const st=this.tw.f[k], s=st.stance; if(!s || s.done) return; s.done=true; if(!s.step) return;
    const tw=this.tw;
    if(s.min>=0.25){ if(tw.ep && s.t-tw.ep.last<=2){ tw.ep.times.push(+s.t.toFixed(2)); tw.ep.last=Math.max(tw.ep.last,s.t); tw.ep.end=tw.ep.last; }
      else { this.closeToe(); tw.ep={start:s.t, end:s.t, last:s.t, times:[+s.t.toFixed(2)], key:this.keyAt(s.t)}; } }
    else this.closeToe();   // heel touched the floor: the episode ends
  }
  closeToe(){ const e=this.tw.ep; if(e && e.times.length>=2){ e.times.sort((a,b)=>a-b); this.events.push({behavior:'toe', kind:'event', start:e.start, end:e.end, count:e.times.length, times:e.times, detail:`${e.times.length} خطوات على أطراف الأصابع`, key:e.key}); } this.tw.ep=null; }
  otherStep(t, lm, sw, hip){
    const o=this.oth, ids=[11,12,13,14,15,16,23,24,25,26,27,28];
    const cur=ids.map(i=>this.P(lm,i)), ref=hip||{x:(cur[0].x+cur[1].x)/2, y:(cur[0].y+cur[1].y)/2};
    o.buf=(o.buf||[]).filter(f=>f.t>=t-1); const old=o.buf.filter(f=>f.t<=t-0.2).pop();   // speed over ≥0.2 s, so frame jitter does not look like movement
    if(old){ const ds=[];
      cur.forEach((p,i)=>{ const q=old.pts[i]; if(p.v>=this.V && q.v>=this.V) ds.push(Math.hypot((p.x-ref.x)-(q.x-old.ref.x), (p.y-ref.y)-(q.y-old.ref.y))); });
      ds.sort((a,b)=>b-a); const top=ds.slice(0,4);              // the 4 fastest points: one limb moving clearly is enough
      const en = ds.length>=6? sum(top)/top.length/sw/(t-old.t) : 0;
      if(en>1.5){ if(!o.on){ o.on=true; o.t0=old.t; } o.last=t; }
      else if(o.on && t-o.last>0.5){ o.on=false; if(o.last-o.t0>=1) o.win.push({start:o.t0, end:o.last}); } }
    o.buf.push({t, pts:cur, ref});
  }
  housekeep(t){
    if(this.j.series && this.j.state==='ground' && t-this.j.series.lastLand>2) this.closeJump();
    if(this.sp.series && t-this.sp.series.last>3) this.closeSpin();
    const tw=this.tw; if(tw.ep && t-tw.ep.last>2 && !tw.f.some(f=>f.phase==='stance' && f.stance && !f.stance.done && f.stance.step && f.stance.t>tw.ep.last)) this.closeToe();
  }
  drain(){
    for(const k of ['L','R']){ const o=this.fl[k]; while(o.out.length){ const ep=o.out.shift(); this.addEpisode('flap', ep, k); } }
    for(const k of ['lean','depth']){ const o=this.rk[k]; while(o.out.length){ const ep=o.out.shift(); const info=(ep.info||[]).filter(Boolean);
      const hx=info.map(i=>i.hx); if(hx.length && Math.max(...hx)-Math.min(...hx)>1.0) continue;   // the body moved from its place: walking, not rocking
      const view=info.length? sum(info.map(i=>i.view))/info.length : 1;
      this.addEpisode('rock', ep, k==='depth'? 'fb' : (view<0.45? 'fb' : 'lr')); } }
  }
  closeBout(){ const c=this.c; if(c.bout){ c.bout.detail = c.bout.count===1? 'تصفيقة واحدة' : `${c.bout.count} تصفيقات متتابعة`; this.events.push(c.bout); c.bout=null; } }
  finish(t){
    if(this.r.on){ const r=this.r; this.events.push({behavior:'raise', kind:'event', start:r.start, end:t, count:1, detail:(r.sides.size>1?'باليدين':'يد واحدة')+' · انتهى الفيديو واليد مرفوعة', key:r.key}); r.on=false; }
    this.closeBout();
    this.fl.L.settle(); this.fl.R.settle(); this.rk.lean.settle(); this.rk.depth.settle(); this.drain();
    this.closeJump(); this.closeSpin();
    this.tw.f.forEach((f,k)=>{ if(f.phase==='stance') this.endStance(k); }); this.closeToe();
    if(this.oth.on && this.oth.last-this.oth.t0>=1) this.oth.win.push({start:this.oth.t0, end:this.oth.last}); this.oth.on=false;
    BKEYS.forEach(b=>{ if(this.u[b]!=null && t-this.u[b]>=1) this.events.push({behavior:b, kind:'undet', start:this.u[b], end:t}); this.u[b]=null; });
    for(const e of this.events){
      if(e.behavior==='flap' && e.tags){ const both=e.tags.has('L')&&e.tags.has('R'); const upF=e.info.length? e.info.filter(i=>i&&i.up).length/e.info.length : 0;
        e.detail=`${both? 'باليدين' : e.tags.has('L')? 'يد واحدة (اليسرى)' : 'يد واحدة (اليمنى)'} · المدة ${(e.end-e.start).toFixed(1)} ث · نحو ${Math.max(2,Math.floor(e.halves/2))} دورات${upF>0.5? ' · اليد أعلى من الكتف: قد تشبه التلويح، للمراجعة' : ''}`; }
      if(e.behavior==='rock' && e.tags){ const d=[...e.tags].map(x=>x==='lr'?'للجانبين':'للأمام والخلف'); e.dir=[...new Set(d)].join(' و');
        e.detail=`${e.dir} · المدة ${(e.end-e.start).toFixed(1)} ث · نحو ${Math.max(2,Math.floor(e.halves/2))} دورات`; }
      delete e.tags; delete e.info; delete e.halves;
    }
    // movement that matched no defined behaviour (any behaviour, targeted or not): listed for review only
    const evs=this.events.filter(e=>e.kind==='event'); const merged=[];
    for(const w of this.oth.win){ const m=merged[merged.length-1]; if(m && w.start-m.end<1) m.end=Math.max(m.end,w.end); else merged.push({...w}); }
    for(const w of merged){ if(evs.some(e=>e.start<=w.end+0.5 && e.end>=w.start-0.5)) continue;
      this.events.push({behavior:'other', kind:'other', start:w.start, end:w.end, count:0, detail:'حركة لم تطابق أي سلوك معرّف (للمراجعة، لا تُعدّ)', key:this.keyAt(w.start)}); }
    this.events.sort((a,b)=>a.start-b.start);
  }
  counts(){
    const o=zeroCounts(); for(const e of this.events) if(e.kind==='event') o[e.behavior]+=e.count||1;
    if(this.c.bout) o.clap+=this.c.bout.count;
    if(this.j.series && this.j.series.times.length>=2) o.jump+=this.j.series.times.length;
    if(this.sp.series) o.spin+=this.sp.series.times.length;
    if(this.tw.ep && this.tw.ep.times.length>=2) o.toe+=this.tw.ep.times.length;
    const open=(b,eps)=>eps.filter(Boolean).some(ep=>!this.events.some(e=>e.behavior===b && e.kind==='event' && ep.start<=e.end+2 && ep.end>=e.start-2));
    if(open('flap',[this.fl.L.ep,this.fl.R.ep])) o.flap++;
    if(open('rock',[this.rk.lean.ep,this.rk.depth.ep])) o.rock++;
    return o; }
}

const selTargets = () => { const v=[...document.querySelectorAll('input[name=tgt]:checked')].map(x=>x.value); return BKEYS.filter(b=>v.includes(b)); };
const liveKeys = () => (run && run.targets) || (document.querySelector('input[name=tgt]')? selTargets() : childTargets());
function renderCounters(cn, co, keys){
  keys = keys || liveKeys();
  co = co || {per:Object.fromEntries(BKEYS.map(b=>[b,{solo:cn[b],sync:0}])), episodes:[], combos:{}};
  const solo = b => Math.max(0, cn[b]-co.per[b].sync);
  $('#liveCounters').innerHTML = (keys.length? '' : '<p class="small muted" style="grid-column:1/-1">اختاري سلوكًا واحدًا على الأقل.</p>') + keys.map(b=>`<div class="counter ${BEH[b].cls}" style="padding:10px 12px"><span class="lbl small">${BEH[b].name} (منفرد)</span><span class="n num">${solo(b)}</span><span class="sub">${BEH[b].unit}${co.per[b].sync?` · ومتزامن: <b class="num">${co.per[b].sync}</b>`:''}</span></div>`).join('')
    + `<div class="counter sync" style="padding:10px 12px"><span class="lbl small">أفعال متزامنة</span><span class="n num">${co.episodes.length}</span>${co.episodes.length?`<div class="combo-list">${Object.entries(co.combos).map(([k,v])=>`<span>${k}: <b class="num">${v}</b></span>`).join('')}</div>`:''}</div>`;
}
function drawTimeline(events, dur, keys){
  const svg=$('#tl'); if(!svg) return; dur=Math.max(dur||1,1); keys = keys || liveKeys();
  const rows=[...keys]; if(events.some(e=>e.kind==='other')) rows.push('other');
  const X = t => 10 + (t/dur)*590;
  let s='';
  rows.forEach((b,i)=>{ const y=8+i*26;
    s+=`<line x1="10" x2="600" y1="${y+9}" y2="${y+9}" stroke="var(--rule)" stroke-width="14"/>`;
    for(const e of events.filter(e=>e.behavior===b)){
      if(e.kind==='undet') s+=`<rect x="${X(e.start)}" y="${y+3}" width="${Math.max(2,X(e.end)-X(e.start))}" height="12" fill="var(--line)"/>`;
      else if(MULTI.has(b) && e.times && e.times.length) e.times.forEach(tt=>{ s+=`<rect x="${X(tt)-1.5}" y="${y+1}" width="3" height="16" rx="1" fill="var(${BEH[b].varc})"/>`; });
      else s+=`<rect x="${X(e.start)}" y="${y+1}" width="${Math.max(3,X(e.end)-X(e.start))}" height="16" rx="2" fill="var(${BEH[b].varc})" ${e.kind==='other'?'opacity=".55"':''}/>`;
    }
    s+=`<text x="612" y="${y+13}" font-size="11.5" fill="var(--ink)">${BEH[b].name}</text>`;
  });
  const H=Math.max(100, 8+rows.length*26+18);
  s+=`<text x="10" y="${H-6}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">0:00</text><text x="600" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono, monospace">${fmtT(dur)}</text>`;
  svg.setAttribute('viewBox', `0 0 760 ${H}`); svg.innerHTML=s;
}
function drawOverlay(lm, W, H){
  const cv=$('#ovl'); if(!cv) return; cv.width=W; cv.height=H; const g=cv.getContext('2d'); g.clearRect(0,0,W,H);
  if(!lm) return;
  const css=getComputedStyle(document.documentElement);
  g.lineWidth=Math.max(2,W/320); g.strokeStyle='rgba(255,255,255,.85)';
  for(const [a,b] of CONN){ const p=lm[a], q=lm[b]; if((p.visibility??1)<.5||(q.visibility??1)<.5) continue; g.beginPath(); g.moveTo(p.x*W,p.y*H); g.lineTo(q.x*W,q.y*H); g.stroke(); }
  const dot=(i,c)=>{ const p=lm[i]; if((p.visibility??1)<.5) return; g.fillStyle=c; g.beginPath(); g.arc(p.x*W,p.y*H,Math.max(4,W/150),0,7); g.fill(); };
  [15,16].forEach(i=>dot(i, css.getPropertyValue('--b-clap').trim()||'#e47'));
  [11,12].forEach(i=>dot(i, css.getPropertyValue('--b-raise').trim()||'#57f'));
  [23,24,25,26,27,28].forEach(i=>dot(i, css.getPropertyValue('--b-stand').trim()||'#a7e'));
}

/* Event matching: reference events are taken in time order; each is paired with the nearest system event not yet paired,

    const evs=evOf(s.id,b).filter(e=>e.kind==='event').map(e=>e.orig? {...e, ...e.orig} : e);
    const sysCount=sum(evs.map(e=>MULTI.has(b)? (e.times?.length||e.count||1) : 1));
    const sysTimes = b==='clap' && s.clapTimes && s.clapTimes.length? s.clapTimes : MULTI.has(b)? evs.flatMap(e=>(e.times&&e.times.length)? e.times : [e.start]).sort((x,y)=>x-y) : evs.map(e=>e.start).sort((x,y)=>x-y);
    const sp=(s.spec||{})[b]; const r={sysCount, sysTimes};
    if(BEH[b].episodic){ r.sysDur=sum(evs.map(e=>Math.max(0,e.end-e.start))); if(sp && sp.dur!=null && String(sp.dur).trim()!==''){ r.specDur=+sp.dur; const mx=Math.max(r.specDur,r.sysDur), mn=Math.min(r.specDur,r.sysDur); r.durIoa = mx===0? 100 : mn/mx*100; } }
    if(sp && sp.count!=null && sp.count!==''){
      const a=+sp.count; r.specCount=a; const mx=Math.max(a,sysCount), mn=Math.min(a,sysCount);
      r.total = mx===0? 100 : mn/mx*100; num+=mn; den+=mx;
      const st=parseTimes(sp.times);
      if(st.length || (sp.times||'').trim()!==''){
        r.specTimes=st; const m=matchTimes(sysTimes, st); Object.assign(r,m);
        r.eventAgree = (m.tp+m.fp+m.fn)? m.tp/(m.tp+m.fp+m.fn)*100 : 100;
        r.precision = (m.tp+m.fp)? m.tp/(m.tp+m.fp)*100 : null; r.recall=(m.tp+m.fn)? m.tp/(m.tp+m.fn)*100 : null;
        r.f1 = (r.precision!=null&&r.recall!=null&&(r.precision+r.recall))? 2*r.precision*r.recall/(r.precision+r.recall) : null;
        const n=Math.max(1,Math.ceil((s.duration||1)/INTERVAL)); let agree=0;
        for(let i=0;i<n;i++){ const lo=i*INTERVAL, hi=lo+INTERVAL; const a1=sysTimes.filter(t=>t>=lo&&t<hi).length, a2=st.filter(t=>t>=lo&&t<hi).length; if(a1===a2) agree++; }

  ${headBlock('الاتفاق والدقة','مقارنة النظام بالتسجيل المرجعي للأخصائية','تشاهد الأخصائية الفيديو نفسه وتسجّل عدد كل حركة وأوقاتها، ونتيجة النظام مخفية في هذه الصفحة حتى يُحفظ تسجيلها المستقل. بعد الحفظ تظهر المقارنة: '+'الاتفاق مع التسجيل المرجعي للأخصائية'+' (لا IOA بين ملاحِظين بشريين مستقلين). عتبة التقييم الأولية التي حددها المشروع: 80%، وليست معيارًا يثبت صلاحية النظام سريريًا.')}
  <div class="sheet row"><label class="f" style="flex:1 1 260px">الجلسة<select id="i_s">${S.sessions.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.date)} · ${esc(x.label)}</option>`).join('')}</select></label>
  ${shown? `<div class="stack" style="flex:1 1 220px;gap:4px"><span class="small muted">اتفاق العدّ الكلي (كل السلوكيات)</span><span class="num" style="font-family:var(--display);font-size:1.6rem;font-weight:700">${pct(R.overall)}</span>${verdict(R.overall)}</div>` : `<div class="notice" style="flex:1 1 300px">التسجيل المرجعي لم يُحفظ بعد: نتيجة النظام مخفية. سجّلي من الفيديو قبل فتح «مراجعة الأحداث» أو لوحة الطفل، لأنهما تعرضان مخرجات النظام.</div>`}</div>
  <details class="sheet stack"><summary style="cursor:pointer;font-weight:600">كيف تُحسب المقارنة؟</summary>
    <ul class="small">
      <li><b>المطابقة:</b> تُرتَّب أحداث التسجيل المرجعي زمنيًا، ويُقرن كل حدث بأقرب حدث للنظام لم يُقرن بعد إذا كان الفرق ${TOL} ثانية أو أقل. الحدث المقترن = <b>صحيح</b>؛ حدث النظام الذي لم يُقرن = <b>زائد</b> (أضافه النظام)؛ حدث الأخصائية الذي لم يُقرن = <b>فائت</b> (فوّته النظام).</li>
      <li><b>اتفاق الأحداث</b> = صحيح ÷ (صحيح + زائد + فائت) × 100. هذا المؤشر الأساسي، لأن العدد الكلي قد يتساوى مع اختلاف الأحداث نفسها.</li>
      <li><b>اتفاق العدّ الكلي</b> = العدد الأصغر ÷ العدد الأكبر × 100، ويُعرض مكمّلًا فقط.</li>
      <li><b>اتفاق الفترات</b>: تُقسم الجلسة فترات ${INTERVAL} ثوانٍ، وتُحسب نسبة الفترات المتطابقة في العدد. <b>اتفاق المدة الكلية</b> للرفرفة والتأرجح = المدة الأقصر ÷ الأطول × 100.</li>
      <li><b>الدقة</b> = صحيح ÷ (صحيح + زائد)، <b>الاستدعاء</b> = صحيح ÷ (صحيح + فائت)، ويُعرض متوسط فرق التوقيت للأحداث المقترنة.</li>

    </ul></details>
  <form id="ioaForm" class="grid g3">

const origEvs = sid => evOf(sid).map(e=>e.orig? {...e, ...e.orig} : e);   // system output as detected, before review edits
function behaviorRows(s,R){
  const co=cooccur(origEvs(s.id));
  return R.keys.map(b=>{ const r=R[b]; const evs=evOf(s.id,b).filter(e=>e.kind==='event'); const cp=co.per[b];
    const both=evs.filter(e=>/باليدين/.test(e.detail||'')).length;
    const extra = b==='raise'? `باليدين ${both}، بيد واحدة ${evs.length-both}` : b==='clap'? `${evs.length} نوبة تصفيق`
      : b==='flap'? `باليدين ${both}، بيد واحدة ${evs.length-both} · المدة الكلية ${r.sysDur.toFixed(1)} ث`
      : b==='rock'? `${['للجانبين','للأمام والخلف'].map(d=>`${d} ${evs.filter(e=>(e.detail||'').includes(d)).length}`).join('، ')} · المدة الكلية ${r.sysDur.toFixed(1)} ث`
      : b==='jump'? `${evs.length} سلسلة قفز` : b==='toe'? `${evs.length} نوبة` : '';
    return {b, name:BEH[b].name, unit:BEH[b].unit, solo:cp.solo, sync:cp.sync, sys:r.sysCount, times:(r.sysTimes||[]).map(fmtT), extra, spec:r.specCount, specTimes:(r.specTimes||[]).map(fmtT), total:r.total, eventAgree:r.eventAgree, tp:r.tp, fp:r.fp, fn:r.fn, f1:r.f1, precision:r.precision, recall:r.recall, sysDur:r.sysDur, specDur:r.specDur, durIoa:r.durIoa}; });
}

    else L.push('  الأخصائية: لم يُسجَّل عدّها بعد');
  }
  const co=cooccur(origEvs(s.id));

  const und=evOf(s.id).filter(e=>e.kind==='undet'), oth=evOf(s.id).filter(e=>e.kind==='other');

  L.push(`حركات خارج الفئات المحددة (للاطلاع، لا تُعدّ): ${oth.length}${oth.length? ' ('+oth.map(e=>fmtT(e.start)+'–'+fmtT(e.end)).join('، ')+')':''}`);
  return L.join('\n');
}

async function copyText(t, el){

}
async function saveFile(name, data){
  let dl=null; try{ dl = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(!dl){ const blob=new Blob([data],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast('حُفظ الملف '+name); return; }
  try{ await dl.save({filename:name, data}); toast('جاهز للحفظ'); }catch(err){ if(err.code!=='declined') toast('تعذّر التنزيل: '+(err.message||err.code)); }
}

/* REPORT */
function weekData(){
  const start = S.reportStart || (()=>{ const d=new Date(); d.setDate(d.getDate()-6); return ymd(d); })();
  S.reportStart=start;
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(start+'T00:00:00'); d.setDate(d.getDate()+i); return ymd(d); });
  const ses=S.sessions.filter(s=>days.includes(s.date));
  const ok = e => e.kind==='event' && (e.status==='approved' || (S.includePending && e.status==='pending'));
  const keys = ses.length? keysFor(ses) : childTargets();
  const per={}; BKEYS.forEach(b=>per[b]=days.map(d=>sum(S.events.filter(e=>e.behavior===b && ok(e) && sessionById(e.sessionId)?.date===d).map(evCount))));
  const dur={}; BKEYS.forEach(b=>{ dur[b]=sum(S.events.filter(e=>e.behavior===b && ok(e) && ses.some(s=>s.id===e.sessionId)).map(e=>Math.max(0,e.end-e.start))); });
  const hours=sum(ses.map(s=>s.duration||0))/3600;
  const undet=sum(S.events.filter(e=>e.kind==='undet' && ses.some(s=>s.id===e.sessionId)).map(e=>e.end-e.start));
  const ctx=S.events.filter(e=>ok(e) && e.context && ses.some(s=>s.id===e.sessionId)).map(e=>({behavior:BEH[e.behavior].name, date:sessionById(e.sessionId).date, time:fmtT(e.start), context:e.context, detail:e.detail}));
  const raiseDur=S.events.filter(e=>e.behavior==='raise'&&ok(e)&&ses.some(s=>s.id===e.sessionId)).map(e=>e.end-e.start);
  const co=mergeCo(ses.map(x=>cooccur(evOf(x.id).filter(ok))));
  return {start, days, ses, per, hours, undet, ctx, raiseDur, co, keys, dur};
}
function barChart(vals, days, color, title){
  const mx=Math.max(4, ...vals); const step = mx<=8?2: mx<=20?5:10; const top=Math.ceil(mx/step)*step;
  const W=300,H=150,l=28,r=8,t=14,bt=26, cw=(W-l-r)/7;
  const Y=v=>t+(H-t-bt)*(1-v/top);
  let g=''; for(let v=0; v<=top; v+=step){ g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${l-6}" y="${Y(v)+3.5}" font-size="10" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono, monospace">${v}</text>`; }
  const dn=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  vals.forEach((v,i)=>{ const x=l+i*cw+cw*0.2, w=cw*0.6; if(v>0) g+=`<rect x="${x}" y="${Y(v)}" width="${w}" height="${Y(0)-Y(v)}" rx="2" fill="${color}"><title>${days[i]}: ${v}</title></rect><text x="${x+w/2}" y="${Y(v)-4}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono, monospace">${v}</text>`;
    g+=`<text x="${x+w/2}" y="${H-8}" font-size="9.5" fill="var(--muted)" text-anchor="middle">${dn[new Date(days[i]+'T00:00:00').getDay()]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}" direction="ltr">${g}</svg>`;
}
function vReport(){

async function download(kind){
  let dl=null; try{ dl = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){}
  let data, name;
  if(kind==='csv'){
    const rows=[['session_date','session','behavior','kind','start_s','end_s','duration_s','count','detail','context','status']];
    for(const e of S.events){ const s=sessionById(e.sessionId)||{}; rows.push([s.date,s.label,BEH[e.behavior].name,e.kind,e.start,e.end,(e.end-e.start).toFixed(2),e.kind==='event'?(e.count||1):0,e.detail,e.context,e.status]); }
    data='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'); name=`bcba-events-${today()}.csv`;
  } else { data=JSON.stringify({child:S.child, sessions:S.sessions, events:S.events, sources:S.sources, exportedAt:new Date().toISOString(), app:'bcba-assistant'},null,2); name=`bcba-data-${today()}.json`; }
  if(!dl){ const blob=new Blob([data],{type: kind==='csv'?'text/csv;charset=utf-8':'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast('حُفظ الملف '+name); return; }
  try{ await dl.save({filename:name, data}); toast('جاهز للحفظ'); }catch(err){ if(err.code!=='declined') toast('تعذّر التنزيل: '+(err.message||err.code)); }
}

/* METHOD */
function vMethod(){
  return `
  ${headBlock('المنهجية والمعايير','كيف يُقاس النظام علميًا','هذه الصفحة تصف المنهجية التي يطبّقها الموقع، ويمكن نقلها إلى قسم المنهجية في البحث.')}
  <div class="sheet method">
    <h2>عنوان التجربة</h2>
    <p><b>${EXP}</b></p>
    <h2>1. التصميم</h2>
    <p>دراسة تطوير وتقييم لنموذج أولي: يقارَن رصد النظام الآلي بملاحظة بشرية مستقلة من أخصائية BCBA على الفيديوهات نفسها. المتغير المقيس هو صدق القياس الآلي لسلوكيات حركية معرّفة تشغيليًا: رفع اليد، والتصفيق، والقيام من الكرسي، ورفرفة اليدين، والتأرجح بالجسم، والقفز المتكرر، والدوران حول النفس، ومغادرة الكرسي، والمشي على أطراف الأصابع. تختار الأخصائية في كل جلسة السلوكيات المستهدفة.</p>
    <h2>2. التعريفات التشغيلية</h2>
    <p>لكل سلوك تعريف قابل للملاحظة والقياس، بلحظة بداية ونهاية وقاعدة عدّ صريحة. طُوّرت التعريفات خصيصًا لهذا المشروع، بمراجعة استشارية من أخصائية تحليل سلوك للتعريفات وطريقة القياس، ولا تُنسب الحركات إلى التوحّد ولا يُعطى لها معنى تشخيصي. يطبّق النظام كل تعريف كقاعدة على نقاط الجسم، وتظهر القاعدتان جنبًا إلى جنب في صفحة السلوكيات.</p>
    <h2>3. أبعاد القياس</h2>
    <ul><li>التكرار: عدد مرات حدوث السلوك في الجلسة.</li><li>المعدل: التكرار مقسومًا على زمن الملاحظة (مرة/ساعة)، ليمكن مقارنة جلسات مختلفة الطول.</li><li>النوبة ومدتها: لرفرفة اليدين والتأرجح بالجسم تُعدّ النوبات (لا كل حركة صغيرة) وتُقاس مدتها، وتُقارن المدة الكلية باتفاق المدة الكلية (Total duration IOA). وللقفز تُعدّ القفزات والسلاسل، وللدوران الدورات الكاملة، وللمشي على أطراف الأصابع الخطوات والنوبات.</li><li>شرط الدورتين وفاصل الثانيتين قواعد مقترحة لتنظيم القياس، وليست معايير تشخيصية، وتُستخدم النسخة نفسها في التسجيل البشري والنظام.</li></ul>
    <h2>4. المرجع البشري</h2>
    <p>تعدّ الأخصائية السلوكيات في الفيديو نفسه، ونتيجة النظام مخفية في صفحة المقارنة حتى يُحفظ تسجيلها، وتسجّل وقت كل حدث إلزاميًا لأن تساوي العدد الكلي لا يعني تطابق الأحداث. ويُقارن التسجيل بمخرجات النظام الأصلية؛ واعتماد الأحداث أو تصحيحها خطوة منفصلة لا تغيّرها.</p>
    <h2>5. مؤشرات الاتفاق والدقة</h2>
    <p>اتفاق العدّ الكلي (Total count IOA):</p>
    <div class="formula">IOA = (smaller count ÷ larger count) × 100</div>
    <p>اتفاق العدّ لكل فترة (Exact count-per-interval IOA) بفترات ${INTERVAL} ثوانٍ:</p>
    <div class="formula">IOA = (intervals with identical counts ÷ total intervals) × 100</div>
    <p>اتفاق المدة الكلية (Total duration IOA) للسلوكيات المقيسة بالنوبات:</p>
    <div class="formula">IOA = (shorter total duration ÷ longer total duration) × 100</div>
    <p>تُستعار معادلات IOA لحساب الاتفاق مع التسجيل المرجعي للأخصائية؛ وهو اتفاق بين نظام آلي وملاحِظة بشرية واحدة، لا IOA بين ملاحِظين بشريين مستقلين. وتُستخدم ${IOA_OK}% عتبة تقييم أولية حددها المشروع (مستلهمة من الحد الشائع في أدبيات تحليل السلوك)، وليست معيارًا يثبت صلاحية النظام سريريًا.</p>
    <p>ولأن النظام مصنِّف آلي، تُحسب أيضًا مقاييس تعلّم الآلة بمطابقة كل حدث بشري بحدث آلي ضمن ±${TOL} ثانية:</p>
    <div class="formula">Precision = TP ÷ (TP + FP)   Recall = TP ÷ (TP + FN)   F1 = 2PR ÷ (P + R)</div>
    <h2>تحديد الطفل المستهدف</h2>
    <p>عند وجود أكثر من طفل في المكان، يلبس الطفل المستهدف علامة بلون زاهٍ: ستكر مطبوع بلون واحد (12×12 سم على الأقل، على الصدر والظهر) أو صدرية. تحدد الأخصائية لون العلامة بلمسة على الصورة، ثم يبحث النظام في كل إطار عن هذا اللون، ويحلّل الشخص الذي يلبسه فقط، ويتحقق أن العلامة تقع على جذعه أو عند معصمه. إذا لم تظهر العلامة أو لم يُتأكد أنها على الشخص نفسه، تُسجَّل الفترة «غير قابلة للتحديد» ولا يُحسب أي سلوك. لا يُستخدم الوجه ولا أي معرّف شخصي، وتُذكر في التقرير نسبة الإطارات التي حُدِّد فيها الطفل.</p>
    <h2>الأفعال المتزامنة</h2>
    <p>يُعدّ الفعل متزامنًا إذا تداخل زمنيًا مع سلوك آخر (بهامش ${SYNC_TOL} ثانية). يُفصل في التقارير بين العدّ المنفرد والعدّ المتزامن لكل سلوك، وتُعدّ الأفعال المتزامنة في خانة مستقلة حسب تركيبتها (مثل: رفع اليد + التصفيق).</p>
    <h2>6. الإنسان صاحب القرار</h2>
    <p>كل حدث آلي يُحفظ «مقترحًا». لا يدخل التقرير إلا ما اعتمده الأخصائي. السياق يُكتب بصيغة «بعد» لتجنّب الاستنتاج السببي غير المثبت.</p>
    <h2>7. الخصوصية</h2>
    <ul><li>المعالجة داخل جهاز المستخدم؛ لا يُرسَل الفيديو ولا يُخزَّن، والبيانات النصية تبقى في متصفح الجهاز نفسه ولا تُرفع إلى أي خادم.</li><li>يُحفظ من كل حدث: الوقت والنوع ونقاط الهيكل العظمي فقط، دون وجه أو مكان.</li><li>رمز للمشارك بدل الاسم، تقليلًا للبيانات وفق نظام حماية البيانات الشخصية في المملكة.</li><li>الكاميرا خارج غرف النوم والحمّامات.</li></ul>
    <h2>8. الأخلاقيات</h2>
    <p>موافقة مستنيرة مكتوبة من ولي الأمر، وقبول الطفل بحسب قدرته مع التوقف عند الانزعاج، ومراجعة استشارية من أخصائية تحليل سلوك، والالتزام بمدونة أخلاقيات مجلس اعتماد محللي السلوك (BACB). التجارب الحالية على متطوعين يؤدون الحركات؛ ولا تُضاف بيانات أطفال أو حالات فعلية قبل الحصول على الموافقات الأخلاقية البحثية المطلوبة، ونموذج الموافقة داخل النظام وحده لا يغني عنها.</p>
    <h2>9. حدود النموذج الأولي</h2>
    <ul><li>دون علامة لونية يفترض النظام طفلًا واحدًا في الصورة؛ ومع العلامة قد يُفقد التتبع إذا تشابه لون العلامة مع ملابس الآخرين أو خلفية الغرفة.</li><li>التصفيق السريع ورفرفة اليدين قد يفوتان عند 15 إطارًا/ث؛ لذلك يتاح 25 إطارًا/ث.</li><li>المشي على أطراف الأصابع يحتاج تصويرًا من الجانب يُظهر الكعبين والأرض؛ ومن الأمام تُسجَّل الفترة «غير قابلة للتحديد».</li><li>الدوران حول النفس يعتمد على تقدير عمق الكتفين من كاميرا واحدة، وهو تقدير تقريبي يحتاج اختبارًا على مقاطع حقيقية.</li><li>التلويح يشبه الرفرفة في شكله الحركي ولا يُفرَّق من الحركة وحدها؛ يُسجَّل للمراجعة دون افتراض الغرض.</li><li>يفترض شخصًا واحدًا في الإطار وزاوية تُظهر الجسم كاملًا.</li><li>السياق (ما حدث قبل السلوك) يُدخله الأخصائي في هذه المرحلة؛ رصده آليًا عمل مستقبلي بنماذج الرؤية واللغة.</li><li>«الحركة خارج الفئات المحددة» تُعرض للاطلاع فقط (حركة واضحة للأطراف ثانية فأكثر لم تطابق أي تعريف)، ولا يصنّفها النظام ولا يعدّها.</li></ul>
    <h2>تطوير مستقبلي</h2>
    <p>تمييز الصوت غير مضاف في النسخة الحالية؛ تُستكمل أولًا اختبارات الحركات المحددة. ويمكن دراسته لاحقًا بعد تحديد المقصود منه وطريقة اختباره ومتطلبات الخصوصية.</p>

(async function boot(){
  $('#views').innerHTML='<p class="muted">جارٍ التحميل…</p>';
  await Store.init();
  { const h0=(location.hash||'').slice(1); S.view=['behaviors','sources','method'].includes(h0)? h0 : 'files'; }
  if(Store.mode==='cloud' && !Store.user){ render(); return; }
  try{ await loadAll(); }catch(err){ $('#views').innerHTML=`<div class="notice bad">تعذّر قراءة البيانات: ${esc(err.message||err.code)}</div>`; renderNav(); return; }
  const h=(location.hash||'').slice(1); S.view = ['behaviors','sources','method'].includes(h)? h : 'files';
  render();
  if(Store.db){
    let tmr=null; const refresh=()=>{ clearTimeout(tmr); tmr=setTimeout(async()=>{ if(S.view==='session' || document.activeElement?.matches('input,textarea,select')) return; await loadAll(); render(); },600); };
    ['children','sessions','sources'].forEach(c=>{ let first=true; Store.db.collection(c).onSnapshot(()=>{ if(first){ first=false; return; } refresh(); }, ()=>{}); });
  }
})();
</script>
